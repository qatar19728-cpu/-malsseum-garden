<script>
// ===== 말씀정원 독립 사이트 설정 =====
// Supabase → Project Settings → API (또는 Connect) 에서 복사해 넣으세요
const SUPABASE_URL = "https://wanbimaryunarvkuqkdh.supabase.co";
const SUPABASE_KEY = "sb_publishable_VhH6KBAZ2lLQ30zZbxdEzA_sHoOMWHs"; // anon / publishable 키 (공개돼도 되는 키). service_role 키는 절대 넣지 마세요
// ===================================
(function(){
  if(!window.supabase || !/^https:\/\/.+supabase\.co/.test(SUPABASE_URL) || SUPABASE_KEY.length<20) return;
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:false}});
  const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null}};
  let clientId=store("sb_client"); if(!clientId){ clientId=Math.random().toString(36).slice(2,10)+Date.now().toString(36); store("sb_client",clientId); }
  let ownerToken=store("sb_owner"); if(!ownerToken){ ownerToken=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join(""); store("sb_owner",ownerToken); }
  async function sha256hex(s){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  function parse(path){ const p=path.split("/"); if(p[0]==="groups"&&p.length===3) return {table:p[2],scope:p[1]}; if(p[0]==="groups"&&p.length===1) return {table:"groups"}; return {table:p[0],scope:"plaza"}; }
  const COLS={verses:["n","c","at","camp","v"],prayers:["n","c","t","at","amen"],groups:["name","at","by"]};
  const pick=(t,row)=>{ const o={}; for(const k of COLS[t]) if(row&&row[k]!==undefined) o[k]=row[k]; return o; };
  function keyQ(q,info,id){ if(info.table==="groups") return q.eq("code",id); q=q.eq("id",id); return info.scope&&info.table!=="prayers"?q.eq("scope",info.scope):q; }
  const db={ collection(path){ const info=parse(path); return {
    doc(id){ return {
      async get(){ const {data,error}=await keyQ(sb.from(info.table).select("*"),info,id).maybeSingle(); if(error) throw error; return {exists:!!data, data:()=>data?pick(info.table,data):null}; },
      async set(rec){ let row; if(info.table==="groups") row={code:id,...pick("groups",rec)}; else row={id,scope:info.scope,...pick(info.table,rec)};
        if(info.table==="prayers"){ row.amen=0; row.owner_hash=await sha256hex(ownerToken); }
        const {error}=await sb.from(info.table).insert(row); if(error) throw error; },
      async update(){ if(info.table!=="prayers") throw new Error("no update"); const {error}=await sb.rpc("pray_amen",{pid:id}); if(error) throw error; },
      async delete(){ if(info.table!=="prayers") throw new Error("no delete"); const {data,error}=await sb.rpc("delete_prayer",{pid:id,token:ownerToken}); if(error) throw error; if(!data) throw new Error("not owner"); }
    }; },
    onSnapshot(cb){
      let alive=true, timer=null;
      const load=async()=>{ let q=sb.from(info.table).select("*");
        if(info.table==="prayers") q=q.eq("scope",info.scope).order("at",{ascending:false}).limit(300); else q=q.eq("scope",info.scope).limit(2000);
        const {data,error}=await q; if(!alive||error) return; cb({docs:(data||[]).map(r=>({id:r.id,data:()=>pick(info.table,r)}))}); };
      load();
      const ch=sb.channel("db-"+info.table+"-"+info.scope+"-"+Math.random().toString(36).slice(2,6))
        .on("postgres_changes",{event:"*",schema:"public",table:info.table,filter:"scope=eq."+info.scope},()=>{ clearTimeout(timer); timer=setTimeout(load,250); })
        .subscribe();
      const poll=setInterval(load,30000);
      return ()=>{ alive=false; clearInterval(poll); sb.removeChannel(ch); };
    } }; } };
  function makeRoom(name){
    let ch=null, ready=false, pending=null, peersFn=null;
    const emit=()=>{ if(!peersFn||!ch) return; const st=ch.presenceState(); peersFn(Object.entries(st).map(([k,arr])=>({id:k,you:k===clientId,presence:arr[arr.length-1]}))); };
    ch=sb.channel("room:"+name,{config:{presence:{key:clientId}}});
    ch.on("presence",{event:"sync"},emit).on("presence",{event:"join"},emit).on("presence",{event:"leave"},emit)
      .subscribe(s=>{ if(s==="SUBSCRIBED"){ ready=true; if(pending) ch.track(pending); } });
    return {
      presence(state){ pending=state; if(ready) ch.track(state); },
      onPeers(fn){ peersFn=fn; emit(); },
      async join(n){ return makeRoom(n); },
      leave(){ try{ ch.untrack(); }catch(e){} sb.removeChannel(ch); ch=null; }
    };
  }
  let lobby=null;
  window.claude={ use: async(n)=> n==="db"?db : n==="room"?(lobby||(lobby=makeRoom("lobby"))) : null };
})();
</script>

<style>
:root{
  --ink:#2b2340; --ink2:#5b5270; --cream:#fbf6ec; --gold:#e8b65a; --gold2:#f6d892;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--cream);font-family:"Gowun Dodum",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:#241d38}
canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:absolute;left:0;right:0;top:0;padding:12px 14px 10px;background:linear-gradient(#1d1830f2,#1d183000);pointer-events:none}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{margin:0;font-family:"Gowun Batang",serif;font-size:18px;letter-spacing:.5px;color:var(--gold2)}
.live{display:flex;align-items:center;gap:6px;font-size:12px;background:#ffffff14;border:1px solid #ffffff22;padding:4px 9px;border-radius:99px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#7ee0a0;box-shadow:0 0 8px #7ee0a0}
.dot.off{background:#c9b88f;box-shadow:none}
.camp{margin-top:9px;font-size:12.5px;color:#e9e2d4}
.camp b{font-family:"Gowun Batang",serif;color:#fff;font-size:14px}
.bar{height:6px;background:#ffffff1c;border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px;transition:width .6s}
.feed{position:absolute;left:12px;bottom:84px;display:flex;flex-direction:column;gap:5px;pointer-events:none;max-width:70%}
.feed div{font-size:11.5px;background:#1d1830b8;border:1px solid #ffffff18;padding:4px 9px;border-radius:10px;animation:fin .4s ease-out;color:#efe7d6}
@keyframes fin{from{opacity:0;transform:translateY(-6px)}}
.hud{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;background:linear-gradient(#1d183000,#1d1830f0 40%)}
.btn{border:0;border-radius:16px;font:inherit;cursor:pointer;color:var(--ink);background:var(--cream);padding:12px 14px;font-size:14px;box-shadow:0 3px 0 #0003;display:flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0003}
.btn.main{flex:1;background:linear-gradient(#f6d892,#e8b65a);font-weight:700;font-size:15px}
.btn.icon{width:42px;padding:12px 0;font-size:18px;background:#ffffff1f;color:#fff;border:1px solid #ffffff2a;box-shadow:none}
.btn.icon.on{background:#e8b65a55;border-color:var(--gold)}
.hint{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);font-size:12px;color:#d9d0c0;background:#1d1830a8;padding:5px 11px;border-radius:99px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
.mode{margin-top:6px;font-size:11px;color:#f3e6c4;display:none;width:max-content;background:#1d1830b8;padding:3px 9px;border-radius:9px}
/* sheet */
.veil{position:absolute;inset:0;background:#0d0a1880;opacity:0;pointer-events:none;transition:opacity .25s}
.veil.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream);color:var(--ink);border-radius:22px 22px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow:auto}
.sheet.show{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:#d6ccb8;margin:0 auto 12px}
.sheet h2{margin:0 0 2px;font-family:"Gowun Batang",serif;font-size:19px}
.sub{font-size:12.5px;color:var(--ink2)}
.prev{margin-top:12px;padding:10px 12px;border-left:3px solid #d9c9a3;background:#f3ecdd;border-radius:0 10px 10px 0;font-family:"Gowun Batang",serif;font-size:14px;line-height:1.6;color:#6b6178}

.target{margin-top:12px;font-family:"Gowun Batang",serif;font-size:17px;line-height:1.75;letter-spacing:.2px}

.row{display:flex;gap:8px;margin-top:12px;align-items:center}

.done{text-align:center;padding:14px 4px}

.toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.9);background:#fbf6ecf2;color:var(--ink);padding:14px 18px;border-radius:16px;font-family:"Gowun Batang",serif;font-size:15px;text-align:center;opacity:0;pointer-events:none;transition:all .35s;box-shadow:0 10px 40px #0006;max-width:84%}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.namebox{margin-top:12px;display:flex;gap:8px}
.namebox input{flex:1;border:2px solid #e3d8c3;border-radius:12px;padding:10px;font:inherit;font-size:15px;outline:none}
.grp{display:none;font-size:11.5px;background:#e8b65a33;border:1px solid #e8b65a88;color:#f6d892;padding:2px 8px;border-radius:99px;margin-right:6px;vertical-align:1px}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mi{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #e6dcc8;background:#fff;border-radius:14px;padding:11px 12px;font:inherit;color:var(--ink);cursor:pointer}
.mi:active{background:#f6efe0}
.mi span{font-size:22px;width:30px;text-align:center}
.mi b{display:block;font-size:14.5px}
.mi small{display:block;font-size:12px;color:var(--ink2);margin-top:1px}
.code{font-size:34px;letter-spacing:6px;font-weight:700;margin:14px 0;color:var(--ink);font-family:monospace;background:#f3ecdd;border-radius:12px;padding:10px}
.cardimg{display:block;width:100%;border-radius:12px;margin-top:12px;box-shadow:0 6px 20px #0002}
.spn{pointer-events:auto;border:0;background:transparent;color:var(--gold2);font-family:"Gowun Batang",serif;font-size:19px;font-weight:700;padding:0;cursor:pointer;display:flex;align-items:center;gap:4px}
.spn:after{content:"▾";font-size:13px;opacity:.8;margin-left:2px}
.spn small{font-size:11px}
.svc{position:absolute;left:10px;right:10px;top:104px;background:#fbf6ecf2;color:var(--ink);border-radius:16px;box-shadow:0 8px 30px #0005;display:none;overflow:hidden}
.svh{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#2b2340;color:#f6d892;font-size:13px}
.svh b{flex:1;font-family:"Gowun Batang",serif;font-size:14.5px}
.svh span{font-variant-numeric:tabular-nums;font-size:12.5px;color:#efe7d6}
.svh button{border:0;background:#ffffff1f;color:#fff;border-radius:8px;font:inherit;font-size:11.5px;padding:3px 8px;cursor:pointer}
.svb{max-height:30vh;overflow:auto;padding:10px 14px 12px;font-size:14px;line-height:1.7}
.svc.min .svb{display:none}
.svb p{margin:4px 0;font-family:"Gowun Batang",serif;font-size:15px}
.svb sup{color:#c98f2a;font-size:10px;margin-right:4px;font-family:"Gowun Dodum",sans-serif}
.svb .calm{font-family:"Gowun Dodum",sans-serif;font-size:13.5px;color:var(--ink2)}
.pref{font-size:12px;color:#9a7a3a;margin-bottom:4px}
.qs{margin:6px 0;padding-left:20px;font-family:"Gowun Batang",serif;font-size:15px}
.order{margin:8px 0 2px;padding-left:20px;font-size:13px;color:var(--ink2)}
.order small{color:#a99f8f}
.nextup{margin-top:8px;font-size:12px;color:#9a8f86;border-top:1px dashed #e0d5c0;padding-top:6px}
.btn.sm{padding:9px 12px;font-size:13px;margin-top:8px;width:100%}
.closed{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#120d22d9;text-align:center;padding:24px}
.closed h3{margin:0;font-family:"Gowun Batang",serif;font-size:24px;color:#f6d892}
.closed .w{font-size:15px;color:#fbf6ec}
.closed .l{font-size:13px;color:#cfc4b0;margin-bottom:10px}
.closed .btn{width:240px;flex:none}
.b{display:inline-block;font-style:normal;font-size:11px;margin-top:4px;padding:1px 7px;border-radius:99px;background:#f0e8d8;color:#8a7f72}
.b.on{background:#e8f3ea;color:#3f8a5c}
.b.live{background:#fde7ea;color:#c0394f;font-weight:700}
.mi.cur{border-color:var(--gold);background:#fff8e6}
.pw{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.pi{background:#fff;border:1px solid #ece2cf;border-radius:12px;padding:9px 11px}
.pt{font-size:14px;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-break:break-all}
.pm{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:5px;font-size:11.5px;color:#9a8f86}
.pm i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.amen{border:1px solid #e3d8c3;background:#fbf6ec;border-radius:99px;font:inherit;font-size:12px;padding:4px 10px;cursor:pointer;color:var(--ink);white-space:nowrap}
.amen.on{background:#2b2340;color:#f6d892;border-color:#2b2340}
.del{border:0;background:none;color:#b0646e;font:inherit;font-size:11.5px;align-self:flex-end;margin-top:-4px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-top:14px}
.tabs button{border:1px solid #e3d8c3;background:#fff;border-radius:99px;font:inherit;font-size:12.5px;padding:5px 11px;cursor:pointer;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:#f6d892;border-color:var(--ink)}
#splash{position:absolute;inset:0;z-index:50;background:#1b1e1d;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s ease;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:66px;height:66px;opacity:0;animation:sfade 1.4s .2s ease forwards}
#splash h2{margin:30px 0 0;font-family:"Gowun Batang",serif;font-weight:400;font-size:38px;letter-spacing:14px;padding-left:14px;color:#e9dcc2;opacity:0;animation:sfade 1.4s .6s ease forwards}
#splash .ss{margin-top:26px;font-size:15px;letter-spacing:1px;color:#8d877c;opacity:0;animation:sfade 1.2s 1s ease forwards;min-height:22px;text-align:center;line-height:1.6}
#splash .sd{margin-top:46px;width:7px;height:7px;border-radius:50%;background:#8c8070;animation:spulse 1.6s ease-in-out infinite}
#splash.ready .sd{display:none}
#splash .sv{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));font-size:11.5px;color:#5f5b54;letter-spacing:.5px;text-align:center;padding:0 24px}
@keyframes sfade{to{opacity:1}}
@keyframes spulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.list{margin-top:10px;font-size:13px;color:var(--ink2);line-height:1.8}
</style>

function woodTex(){ return canvasTex(512,512,(c,w,h)=>{ const rows=8; for(let i=0;i<rows;i++){ const y=i*h/rows; for(let x=-(i%2)*128;x<w;x+=256){ const tone=150+Math.random()*30|0; c.fillStyle=`rgb(${tone+40},${tone+5},${tone-45})`; c.fillRect(x,y,256,h/rows); for(let k=0;k<14;k++){ c.strokeStyle=`rgba(90,55,30,${Math.random()*.12})`; c.beginPath(); const yy=y+Math.random()*h/rows; c.moveTo(x,yy); c.bezierCurveTo(x+80,yy+3,x+160,yy-3,x+256,yy); c.stroke(); } c.strokeStyle="rgba(80,50,30,.45)"; c.lineWidth=2; c.strokeRect(x,y,256,h/rows); } } },[4,6]); }

function glassTex(seed){ return canvasTex(256,512,(c,w,h)=>{ c.clearRect(0,0,w,h); c.save(); c.beginPath(); c.moveTo(10,h-6); c.lineTo(10,130); c.quadraticCurveTo(10,10,w/2,8); c.quadraticCurveTo(w-10,10,w-10,130); c.lineTo(w-10,h-6); c.closePath(); c.clip();
  const cols=["#e98a8a","#7fa7e0","#e8b65a","#8fb996","#b591d9","#f6d892","#6cc4c0"]; let r=seed;
  for(let y=0;y<h;y+=46) for(let x=0;x<w;x+=42){ r=(r*9301+49297)%233280; c.fillStyle=cols[r%cols.length]; c.globalAlpha=.85; c.fillRect(x,y,42,46); }

  c.fillStyle="rgba(255,250,220,.9)"; c.fillRect(w/2-7,150,14,190); c.fillRect(w/2-50,205,100,14);
  c.restore(); c.strokeStyle="#3a2f4d"; c.lineWidth=12; c.beginPath(); c.moveTo(10,h-6); c.lineTo(10,130); c.quadraticCurveTo(10,10,w/2,8); c.quadraticCurveTo(w-10,10,w-10,130); c.lineTo(w-10,h-6); c.stroke(); }); }

function posePerson(p,x,y,moving,sit,dt,t,dirx,diry){
  const c=to3(x,y);
  const tz = sit ? c.Z+.52 : c.Z;
  p.g.position.x+= (c.X-p.g.position.x)*Math.min(1,dt*20); p.g.position.z+=(tz-p.g.position.z)*Math.min(1,dt*20);
  let want = sit ? Math.PI : (moving ? Math.atan2(dirx,diry) : p.yaw);
  let d=want-p.yaw; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; p.yaw+=d*Math.min(1,dt*10); p.g.rotation.y=p.yaw;
  const sw=moving?Math.sin(t*10+p.phase):0;
  if(sit){ p.legs.forEach(l=>{l.rotation.x=-1.45;}); p.body.position.y=.05;
    p.arms.forEach((a,i)=>{const s=i?1:-1; a.rotation.x=-1.25; a.rotation.z=-s*.42;}); p.head.rotation.x=.18; }
  else { p.legs[0].rotation.x=sw*.6; p.legs[1].rotation.x=-sw*.6; p.arms[0].rotation.x=-sw*.5; p.arms[1].rotation.x=sw*.5; p.arms[0].rotation.z=-.18; p.arms[1].rotation.z=.18;
    p.body.position.y=moving?Math.abs(Math.sin(t*10+p.phase))*.06:Math.sin(t*2+p.phase)*.01; p.head.rotation.x=0; }

// ---------- cards (canvas → image) ----------
function wrapText(c,text,maxW){
  const words=text.split(" "); const lines=[]; let cur="";
  for(const w of words){ const t=cur?cur+" "+w:w; if(c.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=t; }
  if(cur) lines.push(cur); return lines;
}
async function fontsReady(){ try{ await Promise.all([document.fonts.load('40px "Gowun Batang"'),document.fonts.load('bold 40px "Gowun Batang"'),document.fonts.load('30px "Gowun Dodum"')]); }catch(e){} }
function paperBG(c,w,h,dark){
  const g=c.createLinearGradient(0,0,0,h);
  if(dark){ g.addColorStop(0,"#2b2340"); g.addColorStop(1,"#1d1830"); } else { g.addColorStop(0,"#fbf6ec"); g.addColorStop(1,"#f1e6cf"); }
  c.fillStyle=g; c.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){ c.fillStyle=dark?`rgba(246,216,146,${Math.random()*.35})`:`rgba(201,143,42,${Math.random()*.08})`; c.beginPath(); c.arc(Math.random()*w,Math.random()*h,Math.random()*3+1,0,7); c.fill(); }
}
function miniLamb(c,x,y,s,col){
  c.save(); c.translate(x,y); c.scale(s,s);
  c.fillStyle=col; c.beginPath(); c.moveTo(-14,8); c.quadraticCurveTo(-16,-14,0,-14); c.quadraticCurveTo(16,-14,14,8); c.closePath(); c.fill();
  c.fillStyle="#f6d7bf"; c.beginPath(); c.arc(0,-30,16,0,7); c.fill();
  c.fillStyle="#5a3a28"; c.beginPath(); c.arc(0,-33,16.5,Math.PI*1.02,Math.PI*1.98); c.fill();
  c.fillStyle="#2b2340"; c.beginPath(); c.arc(-5.5,-29,1.8,0,7); c.arc(5.5,-29,1.8,0,7); c.fill();
  c.fillStyle="#f4a6a6aa"; c.beginPath(); c.arc(-9,-24,2.6,0,7); c.arc(9,-24,2.6,0,7); c.fill();
  c.restore();
}
function dateStr(t){ const d=new Date(t||Date.now()); return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`; }

// ---------- shared: db ----------
function docExists(s){ if(!s) return false; if(typeof s.exists==="function") return s.exists(); if("exists" in s) return !!s.exists; return !!docData(s); }
function docData(s){ if(!s) return null; if(typeof s.data==="function") return s.data(); if("data" in s) return s.data; return s; }
function applyDoc(id,d){ if(!d||!id) return; done.set(id,{n:String(d.n||"누군가").slice(0,16),c:d.c,at:+d.at||0}); }
let unsub=null, subGen=0;
function subscribe(){
  if(typeof unsub==="function"){ try{unsub();}catch(e){} } unsub=null;
  const gen=++subGen; let first=true;
  try{
    unsub=db.collection(colPath()).onSnapshot(snap=>{
      if(gen!==subGen) return;
      const docs=snap&&snap.docs?snap.docs:(Array.isArray(snap)?snap:[]);
      const before=done.size; const seen=new Map();
      for(const d of docs){ const id=d.id||(d.ref&&d.ref.id); const data=docData(d); if(id&&data) seen.set(id,data); }
      done.clear(); seen.forEach((v,k)=>applyDoc(k,v)); renderTop();
      if(!first && done.size>before) sparkle(LECTERN.x,LECTERN.y-30,24);
      first=false;
    });
  }catch(e){ console.log("snapshot failed",e); }
}

  if(!db){ $("mode").style.display="block"; $("mode").textContent="혼자 모드 · 진행은 이 기기에만 저장돼요"; renderTop(); return; }

// ---------- shared: room ----------
let pendingPresence=false, lastSent=0, lobby=null, groupRoom=null, roomGen=0;
function dirty(){ pendingPresence=true; }
setInterval(()=>{
  if(!room||!pendingPresence) return;
  const now=Date.now(); if(now-lastSent<350) return;
  pendingPresence=false; lastSent=now;
  try{ room.presence({n:me.n,c:me.c,x:Math.round(player.tx),y:Math.round(player.ty),px:Math.round(player.x),py:Math.round(player.y),s:player.sit,e:me.e||null,w:me.w||null}); }catch(e){}
},80);
setInterval(()=>{ if(room){pendingPresence=true;} },25000);
function handlePeers(all){
  const list=Array.isArray(all)?all:Object.entries(all||{}).map(([id,v])=>Object.assign({id},v));
  const alive=new Set();
  for(const p of list){
    const st=p.presence||p.state||p.data||p;
    const mine=p.you||p.self||p.isSelf||p.me;
    if(mine||!st||typeof st.x!=="number") continue;
    const id=String(p.id||p.peerId||p.key||p.clientId||st.n);
    alive.add(id);
    let q=peers.get(id);
    if(!q){ q={x:st.px??st.x,y:st.py??st.y,walk:0,face:1,e:null,w:null}; peers.set(id,q); pushFeed(`🐑 ${String(st.n||"누군가").slice(0,12)}님이 들어오셨어요`); }
    q.n=String(st.n||"순례자").slice(0,12); q.c=/^#[0-9a-f]{6}$/i.test(st.c)?st.c:"#e8b65a";
    q.tx=clamp(+st.x||360,60,W-60); q.ty=clamp(+st.y||1000,120,H-30); q.s=!!st.s;
    if(st.e&&st.e.t&&(!q.e||q.e.t!==st.e.t)){ q.e=st.e; if(Date.now()-st.e.t<6000) emote(q.x,q.y,String(st.e.k).slice(0,2)); }
    if(st.w&&st.w.t&&(!q.w||q.w.t!==st.w.t)){ q.w=st.w; if(Date.now()-st.w.t<8000){ sparkle(LECTERN.x,LECTERN.y-30,40); const [cid,vv]=String(st.w.k).split("-"); const cc=CAMPAIGNS.find(c=>c.id===cid); if(cc) pushFeed(`✍️ ${q.n}님이 ${cc.title.split(" ")[0]} ${vv}절을 이어 썼어요`);} }
  }
  for(const id of [...peers.keys()]) if(!alive.has(id)) peers.delete(id);
  $("online").textContent=`지금 ${peers.size+1}명 함께`;
}
async function attachRoom(){
  if(!lobby) return;
  const gen=++roomGen;
  if(groupRoom){ try{ groupRoom.leave(); }catch(e){} groupRoom=null; }
  peers.clear();
  const rname = space==="relay" ? (group?"g-"+group.code:null) : "s-"+space+(group?"-"+group.code:"");
  if(rname){
    try{ lobby.presence({hidden:true}); }catch(e){}
    try{ groupRoom=await lobby.join(rname); }catch(e){ groupRoom=null; }
    if(gen!==roomGen) return;
    room=groupRoom||lobby;
  } else room=lobby;
  try{ room.onPeers(all=>{ if(gen===roomGen) handlePeers(all); }); }catch(e){}
  $("online").textContent="지금 1명 함께"; dirty();
}
async function initRoom(){
  try{ lobby=await claude.use("room"); }catch(e){ lobby=null; }

function fmtWhen(t){ const p=kstParts(t); const ap=p.h<12?"오전":"오후"; const hh=p.h%12||12; return `${p.mo}월 ${p.d}일(${DOW[p.dow]}) ${ap} ${hh}:${String(p.mi).padStart(2,"0")}`; }
function fmtLeft(ms){ ms=Math.max(0,ms); const m=Math.ceil(ms/60e3); const d=Math.floor(m/1440), h=Math.floor(m%1440/60), mm=m%60; return (d?d+"일 ":"")+(h?h+"시간 ":"")+(d?"":mm+"분"); }

function curStep(sp){
  const st=schedState(sp); if(st.phase!=="live") return {st};

}

const prayers=new Map(); let unsubP=null, subPGen=0;

function cleanP(d){ return {n:String(d.n||"누군가").slice(0,16),c:/^#[0-9a-f]{6}$/i.test(d.c)?d.c:"#e8b65a",t:String(d.t||"").slice(0,140),at:+d.at||0,amen:Math.max(0,+d.amen||0)}; }
function subscribePrayers(){
  if(typeof unsubP==="function"){ try{unsubP();}catch(e){} } unsubP=null;
  const gen=++subPGen;
  try{ unsubP=db.collection(prayPath()).onSnapshot(snap=>{
    if(gen!==subPGen) return;
    const docs=snap&&snap.docs?snap.docs:(Array.isArray(snap)?snap:[]);
    prayers.clear(); for(const d of docs){ const id=d.id||(d.ref&&d.ref.id); const data=docData(d); if(id&&data&&data.t) prayers.set(id,cleanP(data)); }
    if(sheet.classList.contains("show")&&$("pwList")) renderWallList();

  }); }catch(e){ console.log("prayer snapshot failed",e); }
}

function ago(t){ const m=Math.floor((Date.now()-t)/60e3); if(m<1) return "방금"; if(m<60) return m+"분 전"; const h=Math.floor(m/60); if(h<24) return h+"시간 전"; return Math.floor(h/24)+"일 전"; }

  if(shared&&db){ try{ await db.collection(prayPath()).doc(id).delete(); }catch(e){ toast("내리지 못했어요"); return; } }
  prayers.delete(id); if(!shared) savePrayersLocal();
  const mine=ls("br_myprayers")||{}; delete mine[id]; ls("br_myprayers",mine);
  renderWallList(); svcIdx=-1; tickService(true);
}
document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("[data-act=wall]"); if(b&&!b.onclick) openPrayerWall(); });

function goToAltar(){ moveTo(LECTERN.x+(player.x<LECTERN.x?-60:60),LECTERN.y+110,openPrayerWall); }

// ---------- boot ----------
(function(){
  let h=""; try{ h=(location.hash||"").replace("#",""); }catch(e){}
  const saved=ls("br_group");
  if(/^g-[a-z0-9]{4,12}$/.test(h)){ const code=h.slice(2); group={code,name:(saved&&saved.code===code&&saved.name)||ls("br_gname_"+code)||("모임 "+code)}; }
  else if(saved&&saved.code) group=saved;
})();
renderGroup(); loadLocal(); loadPrayersLocal(); renderSpaceUI(); renderTop(); tickService(true);
$("spName").onclick=openSpaces;
$("svX").onclick=()=>{ const c=$("svc"); c.classList.toggle("min"); $("svX").textContent=c.classList.contains("min")?"펼치기":"접기"; };
$("clPrac").onclick=()=>{ practice={sp:space,start:Date.now()}; svcIdx=-1; tickService(true); toast("연습 모드예요. 순서가 지금부터 진행돼요"); };
$("clPray").onclick=()=>switchSpace("prayer");
$("clMove").onclick=openSpaces;
const splashStart=Date.now();
function splashReady(){ const sp=$("splash"); if(!sp||sp.classList.contains("ready")) return; sp.classList.add("ready");
  $("splashSub").innerHTML="화면을 눌러 들어가기<br><span style='font-size:12.5px;color:#6f6a62'>🎵 찬송이 함께 흘러나와요</span>";
  sp.onclick=()=>{ sp.classList.add("out"); if(ls("br_audio")!==false) setAudio(true); setTimeout(()=>sp.remove(),1100); const h=$("hint"); h.style.opacity=1; setTimeout(()=>h.style.opacity=0,7000); }; }
setTimeout(splashReady, 2600);
if(!build3D()){ $("hint").textContent="3D 화면을 불러오지 못했어요. 새로고침해 주세요"; $("hint").style.opacity=1; }
window.addEventListener("resize",resize); resize();
$("bSound").onclick=()=>setAudio(!audioOn); if(audioOn){ $("bSound").textContent="🎵"; $("bSound").classList.add("on"); }
requestAnimationFrame(frame);
(function waitClaude(n){
  if(window.claude&&typeof window.claude.use==="function"){ initDB(); initRoom(); return; }
  if(n>30){ $("mode").style.display="block"; $("mode").textContent="미리보기 · 진행은 이 기기에만 저장돼요"; $("online").textContent="나 혼자"; $("dot").classList.add("off"); return; }
  setTimeout(()=>waitClaude(n+1),100);
})(0);
